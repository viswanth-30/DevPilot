spring.application.name=backend

# ─── PostgreSQL DataSource ──────────────────────────────────────────────────
# Set DB_USERNAME and DB_PASSWORD as environment variables before running.
# DB_URL allows overriding the host/port/db for production (e.g. jdbc:postgresql://db:5432/devpilot)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/devpilot_db}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ─── JPA / Hibernate ────────────────────────────────────────────────────────
# Use update for development, override to validate or none in production.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ─── GitHub API ─────────────────────────────────────────────────────────────
# Set GITHUB_TOKEN as an environment variable before running.
# Never put an actual token value in this file.
github.api.base-url=https://api.github.com
github.api.token=${GITHUB_TOKEN}

# ─── Security / CORS ────────────────────────────────────────────────────────
# Comma-separated list of allowed origins. Use env var to configure production domain.
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
