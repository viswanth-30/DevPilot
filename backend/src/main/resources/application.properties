spring.application.name=backend

# ─── PostgreSQL DataSource ────────────────────────────────────────────────────
# Set DB_USERNAME and DB_PASSWORD as environment variables before running.
# Example (PowerShell): $env:DB_USERNAME="devpilot_user"; $env:DB_PASSWORD="yourpassword"
spring.datasource.url=jdbc:postgresql://localhost:5432/devpilot_db
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ─── JPA / Hibernate ─────────────────────────────────────────────────────────
# 'update' creates/alters tables automatically to match entity definitions.
# Change to 'validate' or 'none' in production.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
